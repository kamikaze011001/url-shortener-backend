spring:
  application:
    name: url-shortener
  profiles:
    default: local

  # ADR-0001: MVC on virtual threads, not WebFlux. Blocking JDBC stays blocking; each
  # request parks a virtual thread instead of holding a platform thread.
  threads:
    virtual:
      enabled: true

  datasource:
    # Host port 5433 — see docker-compose.yml; 5432 is taken by an unrelated Postgres.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
    hikari:
      # With virtual threads the pool — not the thread count — is the real concurrency
      # limit. That makes pool sizing a deliberate capacity decision (ADR-0001).
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    # Mailpit locally; a real provider in production, set entirely by environment.
    # Nothing in the code knows which is which — see shared/mail/MailSender.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # A hung SMTP connection must not hold a request open indefinitely.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms

app:
  # The single most important line in this file. If the short base URL is ever derived
  # from the request or hardcoded, the first production deploy hands out
  # http://localhost:8080/aB3xY9z to real users (03-architecture.md).
  short-base-url: ${SHORT_BASE_URL:http://localhost:8080}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
    session-ttl: 1h
    # Secure cookies cannot be set over plain HTTP, and localhost has no TLS.
    cookie-secure: false
  click-hash-salt: ${CLICK_HASH_SALT:dev-only-salt}
  mail:
    from: ${MAIL_FROM:no-reply@switchboard.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.sonanh.urlshortener: DEBUG
