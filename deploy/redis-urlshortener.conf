# A Redis instance belonging to this application alone.
#
# Not a database index on a shared server. An index is a namespace, not an isolation
# boundary: every index on one server shares its memory ceiling, its eviction policy and
# its lifetime, so a neighbour's traffic can evict this application's keys and a single
# flush takes out every tenant at once. A separate process costs about 10 MB and makes
# each of those someone else's problem.

port 6380
bind 127.0.0.1 -::1
protected-mode yes

# Named for the app, so `ps` and `systemctl` say which Redis this is on a host that will
# eventually have more than one.
pidfile /run/redis-urlshortener/redis.pid
logfile /var/log/redis/redis-urlshortener.log
dir /var/lib/redis-urlshortener

# ADR-0004: Redis is a cache, never the truth. Nothing here cannot be rebuilt from
# Postgres, so persistence would buy a slower restart and a disk to run out of.
save ""
appendonly no

# The cap is what makes this instance a good neighbour: it can never grow into the
# memory another service needs. `allkeys-lru` rather than `noeviction` because a full
# cache should shed its coldest entries, not start refusing writes — the rate limiter
# fails open (see RedisRateLimiter), and an eviction is cheaper than an outage.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Rate-limit counters are the largest keyspace here and every one of them carries a TTL.
# Sampling more keys per cycle keeps expired counters from accumulating between windows.
hz 10
